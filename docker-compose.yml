version: "3.8"

services:
  websocket:
    build: .
    ports:
      - "8080:8080"
      - "8081:8081"
    restart: always

  nginx:
    image: nginx:latest
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - websocket
    restart: always
